[archive]
solution_dim = 256
dims = [50, 50]
ranges = [[1.0, 10.0], [0.0, 1.0]]
learning_rate = 1.0
threshold_min = 0.0

[emitter]
sigma0 = 0.3
batch_size = 500
n_emitters = 1

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
n_seeds = 5000
seed = 42

[novelty]
ad_model_path = "data/predictor/ad_model.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[run]
n_generations = 2000
eval_every = 10
seed = 42

[output]
output_dir = "results"
run_name = "default"
