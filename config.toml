[archive]
solution_dim = 256
learning_rate = 0.01
threshold_min = 0.0
objective_cap = 0.75

[[archive.dimensions]]
name = "ad"
resolution = 15
range = [0.0, 0.8]

[[archive.dimensions]]
name = "fsp3"
resolution = 30
range = [0.0, 1.0]

[emitter]
sigma0 = 0.5
batch_size = 32
n_emitters = 16

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
seed = 42

[ad]
ad_model_path = "data/predictor/ad_model.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2
max_cache_size = 5000

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[pca]
path = "data/pca_latent.joblib"
enabled = true
variance_threshold = 0.99


[run]
n_generations = 15
eval_every = 5
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "TEST2"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 3
