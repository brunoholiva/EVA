[archive]
solution_dim = 256
dims = [15, 15, 10, 10, 10]
ranges = [[1.0, 6.0], [0.0, 0.7], [-1.0, 6.0], [0.0, 200.0], [50.0, 600.0]]
dimension_names = ["br_sascore", "ad", "logp", "tpsa", "mw"]
dimension_enabled = [true, true, false, false, true]
learning_rate = 0.1
threshold_min = 0.0

[emitter]
sigma0 = 0.5
batch_size = 32
n_emitters = 8

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
n_seeds = 15000
seed = 42

[ad]
ad_model_path = "data/predictor/ad_model.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2
max_cache_size = 5000

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[pca]
path = "data/pca_latent.joblib"
enabled = true
variance_threshold = 0.99

[run]
n_generations = 3000
eval_every = 10
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "exp4_more_seeds"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 25
