[archive]
solution_dim = 256
learning_rate = 0.01
threshold_min = 0.01
objective_cap = 1.0

[[archive.dimensions]]
name = "ad"
resolution = 15
range = [0.0, 0.9]
scaffold = false


[[archive.dimensions]]
name = "tpsa"
resolution = 25
range = [0.0, 200.0]
scaffold = false


[emitter]
sigma0 = 0.5
batch_size = 32
n_emitters = 16
restart_mode = "hybrid"
random_restart_prob = 0.7

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
seed = 42

[ad]
ad_model_path = "data/predictor/ad_model_actives.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[pca]
path = "data/pca_latent.joblib"
enabled = true

[warm_start]
enabled = true
n_top = 16
n_generations = 1
threshold_min = 0.0
representatives_path = "data/warmstart_representatives/representatives_all.csv"


[run]
n_generations = 1000
eval_every = 20
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "no_repeats_novel"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 3
