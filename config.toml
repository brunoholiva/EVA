[archive]
solution_dim = 256
dims = [15, 15, 10, 10, 10, 10]
ranges = [[1.0, 6.0], [0.0, 0.7], [0.0, 1.0], [-1.0, 6.0], [0.0, 200.0], [50.0, 800.0]]
dimension_names = ["br_sascore", "ad", "novelty", "logp", "tpsa", "mw"]
dimension_enabled = [true, true, false, true, true, true]
learning_rate = 0.1
threshold_min = 0.0

[emitter]
sigma0 = 0.3
batch_size = 500
n_emitters = 4

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
n_seeds = 2500
seed = 42

[ad]
ad_model_path = "data/predictor/ad_model.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2
max_cache_size = 5000

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[novelty]
n_neighbors = 5
n_bits = 2048
radius = 2
max_cache_size = 5000

[run]
n_generations = 150
eval_every = 10
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "exp1"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 25
