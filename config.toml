[archive]
solution_dim = 256
learning_rate = 0.01
threshold_min = 0.1

[[archive.dimensions]]
name = "fsp3"
resolution = 15
range = [0.0, 0.85]
scaffold = false


[[archive.dimensions]]
name = "tpsa"
resolution = 25
range = [9.0, 162.0]
scaffold = false


[[archive.dimensions]]
name = "vsa_estate2"
resolution = 10
range = [-1.0, 55.0]
scaffold = false


[emitter]
sigma0 = 0.5
batch_size = 32
n_emitters = 16
restart_rule = "basic"
restart_every = 50
n_keeper_emitters = 4

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
seed = 42

[activity]
model_path = "data/predictor/tabpfn_chemeleon.joblib"
device = "cuda"
softmax_temperature = 2.0
representation = "chemeleon"

[pca]
path = "data/pca_latent.joblib"
enabled = true

[run]
n_generations = 1000
eval_every = 20
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "vsa_estate2_3d_cmaonly"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 3
molecule_every = 10
