[archive]
solution_dim = 256
learning_rate = 0.01
threshold_min = 0.6

[[archive.dimensions]]
name = "balabanj"
resolution = 22
range = [1.3, 2.9]
scaffold = false

[[archive.dimensions]]
name = "fsp3"
resolution = 22
range = [0.0, 0.6]
scaffold = false

[emitter]
sigma0 = 0.5
batch_size = 36
n_emitters = 15
bounds = 3.0
restart_every = 100
n_keeper_emitters = 0
mixed_restarts = false
restart_rule = 100
ranker = "imp"

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
seed = 42

[activity]
model_path = "data/predictor/tabpfn_minimol.joblib"
device = "cuda"
representation = "minimol"

[pca]
path = "data/pca_latent.joblib"
enabled = true

[run]
n_generations = 1000
eval_every = 20
seed = 42
resume_from = ""
hypothesis = "CMA-MAE with balabanj and fsp3 map with threshold_min = 0.6 and imp ranker"

[output]
output_dir = "results"
run_name = "02_cmamae_balaban_fsp3_thresh06"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 3
molecule_every = 10
coverage_every = 1000
