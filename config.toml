[archive]
solution_dim = 256
learning_rate = 0.01
threshold_min = 0.3
objective_cap = 0.95

[[archive.dimensions]]
name = "bcut2d_logplow"
resolution = 15
range = [-3.2, -1.7]
scaffold = false


[[archive.dimensions]]
name = "vsa_estate2"
resolution = 15
range = [-1.0, 60.0]
scaffold = false


[emitter]
sigma0 = 1.5
batch_size = 32
n_emitters = 16

[generative]
model_repo_id = "3BioCompBio/chembed-default"
device = "cuda"
latent_dim = 256
seed = 42

[ad]
ad_model_path = "data/predictor/ad_model.joblib"
n_neighbors = 5
n_bits = 2048
radius = 2
max_cache_size = 5000

[activity]
model_path = "data/predictor/tabpfn_model.joblib"
device = "cuda"
softmax_temperature = 2.0

[pca]
path = "data/pca_latent.joblib"
enabled = true
variance_threshold = 0.99

[warm_start]
enabled = false
n_samples = 100
n_top = 16
n_generations = 50
threshold_min = 0.0


[run]
n_generations = 500
eval_every = 20
seed = 42
resume_from = ""

[output]
output_dir = "results"
run_name = "vsa2_bcut2_sigma"

[tensorboard]
enabled = true
log_dir = "tensorboard"
scalar_every = 1
histogram_every = 10
figure_every = 3
